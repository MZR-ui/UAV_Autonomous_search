# BT Engine 配置
tick_rate: 100.0            # BT tick 频率 (Hz)
default_channels: 16        # 通道数
channel_default: 1500       # 默认中立值
channel_min: 1000           # 最低 PWM
channel_max: 2000           # 最高 PWM

# /control_data 发布频率
publish_rate: 100.0

# 起飞技能参数
enable_height_monitor: false    # 高度偏差 DANGER 监测（拆桨测试时 false）
landing_height_threshold: 0.1   # 着陆判定：测距高度阈值 (m)
landing_hold_time: 2.0          # 着陆判定：持续时长 (s)
hover_reach_hold_time: 0.0      # 提前到高度悬停：达标持续确认时长 (s)，0=一达标立即切悬停，靠惯性到位
hover_reach_threshold: 0.85      # 提前到高度悬停：触发高度阈值 (m)，z≥该值即切悬停（原 1.0-0.1=0.9；想减超调可降到 0.8 提前切）

# 起飞 PID 修正参数（对轨迹油门的小幅反馈修正）
# 实测 Kp=200 会把轨迹油门 1420 推到 ~1470，导致爬升速度过快、超调 0.22m → 降到 80
kp: 80.0       # 比例：误差(m) → PWM 油门修正（前馈轨迹是主力，PID 只做小幅修正）
ki: 10.0       # 积分：消除稳态误差（按 0.02s/tick 累积，作用弱）
kd: 8.0        # 微分：抑制超调（接近目标时按爬升速度主动收油门；测距噪声大就降到 2~3）

# ================= 轨迹跟踪（最小 Snap）=================
# 触发：悬停态下遥控 CH6 拨到中档（ch6_mid_low~ch6_mid_high 之间）持续 ch6_debounce 秒
# 坐标系：触发瞬间 VINS 输出为原点，飞控姿态定重力方向（任务系 M，x=机头水平投影）
feedback_mode: "closed_loop"   # closed_loop=闭环（VINS 反馈+控制器）；open_loop=开环（纯前馈看效果）
gimbal_lock: true              # 轨迹期间锁定云台（true=不发送云台指令）
height_source: "rangefinder"   # 垂直定高数据源：rangefinder=飞控测距 / barometer=飞控气压 / vins=VINS z
hover_hold_before_traj: 5.0    # 轨迹前上位机悬停稳定时长 (s)，期间 CH6 中档才被接受

# ---- 轨迹目标与时间 ----
target_x: 2.0                  # 目标点 x (m，任务系，机头水平方向)
target_y: 0.0                  # 目标点 y (m，任务系，左)
target_z: 1.0                  # 目标点 z (m，任务系，上)
duration_mode: "auto"          # auto=按 cruise_speed 估时长；fixed=用 fixed_duration
fixed_duration: 0.0            # duration_mode=fixed 时的固定轨迹时长 (s)，0=忽略
cruise_speed: 0.5              # auto 模式巡航速度 (m/s)，时长=dist/speed 后夹在 [T_min,T_max]
T_min: 2.0                     # auto 模式最小时长 (s)
T_max: 8.0                     # auto 模式最大时长 (s)

# ---- 位置控制器（差分平坦）----
kp_xy: 1.0                     # 水平位置比例增益 (1/s²)
kp_z: 2.0                      # 垂向位置比例增益
kd_xy: 0.5                     # 水平速度微分增益 (1/s)
kd_z: 0.8                      # 垂向速度微分增益
gravity: 9.81                  # 重力加速度 (m/s²)
angle_max: 0.35                # 最大倾角 (rad)，映射到 ±500 PWM
hover_throttle: 1420.0         # ANGLE 悬停油门 PWM（实测标定）
k_thr: 30.0                    # 油门推力→PWM 增益 (PWM/(m/s²))
pitch_sign: -1.0               # 俯仰角→PWM 符号（前倾为正位移）
roll_sign: 1.0                 # 横滚角→PWM 符号
yaw_enabled: false             # 是否启航向控制（当前保持 CH4 中立）
yaw_kp: 0.0                    # 航向比例增益

# ---- 到达 / 安全 / 触发 ----
arrive_tol: 0.1                # 到达判定：位置误差阈值 (m)
vel_tol: 0.1                   # 到达判定：速度阈值 (m/s)
arrive_hold: 1.0               # 到达后保持确认时长 (s)
danger_tol: 0.8                # DANGER：位置跟踪误差超限 (m)，超限中止上锁
timeout_traj: 12.0             # 轨迹总超时 (s)
odom_stale_timeout: 0.3        # VINS 位姿数据判 stale 阈值 (s)，超时中止
ch6_mid_low: 1400              # CH6 中档判定下限
ch6_mid_high: 1600             # CH6 中档判定上限
ch6_debounce: 0.3              # CH6 中档去抖时长 (s)
override_threshold: 10         # 手动接管阈值：姿态/云台通道偏离中立(1500)超过该值即交还遥控
