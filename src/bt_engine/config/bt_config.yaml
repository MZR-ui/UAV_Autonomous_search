# BT Engine 配置
tick_rate: 100.0            # BT tick 频率 (Hz)
default_channels: 16        # 通道数
channel_default: 1500       # 默认中立值
channel_min: 1000           # 最低 PWM
channel_max: 2000           # 最高 PWM

# /control_data 发布频率
publish_rate: 100.0

# 起飞技能参数
enable_height_monitor: false    # 高度偏差 DANGER 监测（拆桨测试时 false）
landing_height_threshold: 0.1   # 着陆判定：测距高度阈值 (m)
landing_hold_time: 2.0          # 着陆判定：持续时长 (s)

# ================= 起转 + 起飞（rest-to-rest snap）=================
spool_duration: 2.0          # 起转油门 S 曲线 ramp 时长 (s)
spool_peak_ratio: 0.90       # 起转峰值 = spool_throttle_min + (hover_throttle−spool_throttle_min)×该比例（<1 保证不起飞；电池漂移实测离地则降 0.85）
spool_throttle_min: 1000     # 起转起始油门 PWM（怠速）
takeoff_duration: 3.0        # 起飞 rest-to-rest snap 时长 (s)，1m/3s 峰值 a_z≈0.84 m/s² << g
takeoff_lateral: false       # 起飞期是否开水平环（首飞 false=仅垂直，跑稳后再开）

# ================= 轨迹跟踪（最小 Snap）=================
# 触发：悬停态下遥控 CH6 拨到中档（ch6_mid_low~ch6_mid_high 之间）持续 ch6_debounce 秒
# 坐标系：起飞点机头系——原点=解锁起飞瞬间的 VINS 位置，x=起飞时机头水平投影，z=离地/相对起飞点高度
feedback_mode: "closed_loop"   # closed_loop=闭环（VINS 反馈+控制器）；open_loop=开环（纯前馈看效果）
target_mode: "relative"        # 目标语义：relative=每次相对当前点飞 target 增量 / absolute=固定绝对点（起飞点机头系）
trigger_source: "ch6"          # 触发源：ch6=遥控 CH6 上升沿 / topic=/traj_trigger 话题（std_msgs/Empty）
gimbal_lock: true              # 轨迹期间锁定云台（true=不发送云台指令）
height_source: "rangefinder"   # 垂直定高数据源：rangefinder=飞控测距(离地) / barometer=飞控气压(相对home) / vins=VINS z(相对起飞点)
hover_hold_before_traj: 5.0    # 轨迹前上位机悬停稳定时长 (s)，期间 CH6 中档才被接受

# ---- 轨迹目标与时间 ----
target_x: 2.0                  # target_mode=relative 时：每次相对当前点前向增量 (m)；absolute 时：绝对点 x
target_y: 0.0                  # 相对增量/绝对点 y（左为正）
target_z: 0.0                  # 相对增量/绝对点 z（relative=每次再升高量；absolute=离地高度）
duration_mode: "auto"          # auto=按 cruise_speed 估时长；fixed=用 fixed_duration
fixed_duration: 0.0            # duration_mode=fixed 时的固定轨迹时长 (s)，0=忽略
cruise_speed: 0.5              # auto 模式巡航速度 (m/s)，时长=dist/speed 后夹在 [T_min,T_max]
T_min: 2.0                     # auto 模式最小时长 (s)
T_max: 8.0                     # auto 模式最大时长 (s)

# ---- 位置控制器（差分平坦）----
kp_xy: 1.0                     # 水平位置比例增益 (1/s²)
kp_z: 1.5                      # 垂向位置比例增益（首飞再保守：2.0→1.5，爬升更温和）
kd_xy: 1.4                     # 水平速度微分增益 (1/s)，ζ≈0.7（配 kp_xy=1.0；原 0.5 因无速度反馈未生效）
kd_z: 1.7                      # 垂向速度微分增益，ζ≈0.7（配 kp_z=1.5；原 2.0）
gravity: 9.81                  # 重力加速度 (m/s²)
angle_max: 0.25                # 最大倾角 (rad)，映射到 ±500 PWM（首飞收紧：0.35→0.25，限制失控幅度）
hover_throttle: 1420.0         # ANGLE 悬停油门 PWM（粗略初值；2026-10-05 实测真实≈1440，偏置估计器在悬停里 bootstrap 补足 ~20PWM）
k_thr: 30.0                    # 油门推力→PWM 增益 (PWM/(m/s²))
out_slew_max: 1000.0           # 输出变化率限幅 (PWM/s)：限制 hover/trajectory 每通道 PWM 变化速率，防单拍野值/大误差阶跃；0=不限幅
pitch_sign: 1.0                # 俯仰角→PWM 符号：正向=低头(CH2>1500)。标准 INAV CH2>1500=低头，故 +1；首飞前地面验证方向！
roll_sign: 1.0                 # 横滚角→PWM 符号：正向=右滚(CH1>1500)。标准 INAV CH1>1500=右滚
yaw_enabled: false             # 是否启航向控制（当前保持 CH4 中立）
yaw_kp: 0.0                    # 航向比例增益

# ---- 油门偏置估计器（在线学习真实悬停油门，吸收质量/电压变化，消除稳态高度误差）----
hover_bias_enabled: true      # 总开关（false=回退纯 PD；飞行异常可一键关掉）
hover_bias_ki: 3.0            # 积分增益 PWM/(m·s)：ep_z>0(偏低)时 bias 增加；慢积分收敛稳
hover_bias_max: 80.0          # bias 限幅 ±80 PWM（抗饱和）
hover_bias_ep_max: 0.6        # 仅 |ep_z| < 该值时积分（放宽到 >0.44m 稳态误差，否则 ~20PWM 悬停油门差学不到）
hover_bias_vz_max: 0.3        # 仅 |v_z| < 该值时积分（稳定悬停才学）

# ---- 速度估计器（一阶互补：飞控加速度计积分 + 位置源去漂移）----
vel_est_enabled: true          # 速度环总开关（false=回退旧行为 v_M=0）
vel_est_alpha_z: 0.98          # Z 一阶互补权重（IMU 占比，越大越靠 IMU、去漂越慢）
vel_est_alpha_xy: 0.95         # XY 一阶互补权重（IMU 占比；VINS 位置差分做慢通道去漂）
vel_est_gravity: 9.80665       # 重力加速度幅值 (m/s²)，用于加速度计去重力

# ---- 悬停安全限幅 ----
hover_danger_tol: 0.6          # 悬停位置跟踪误差超限阈值 (m)（放宽到 >0.44m 稳态误差，避免偏置学习期误触降落）
hover_danger_hold: 0.3         # 越界持续时长 (s)，防测距噪声误触发
hover_max_height: 2.5          # 绝对高度上限 (m)，测距仪，越界即安全动作（起飞1m + 轨迹相对+1m 终点2m，留0.5m余量；先确认测距仪量程≥2.5m）
hover_min_height: 0.3          # 绝对高度下限 (m)
hover_safety_action: "landing" # 越界动作：landing=CH7 RTH 自动降落 / abort=上锁

# ---- 到达 / 安全 / 触发 ----
arrive_tol: 0.1                # 到达判定：位置误差阈值 (m)（轨迹段使用）
takeoff_arrive_tol: 0.6        # 起飞→悬停到达判定 (m)：比 arrive_tol 放宽，允许起飞停在大偏差(~0.44m 稳态)，交给悬停油门偏置 bootstrap 补足
vel_tol: 0.1                   # 到达判定：速度阈值 (m/s)
arrive_hold: 1.0               # 到达后保持确认时长 (s)
danger_tol: 0.8                # DANGER：位置跟踪误差超限 (m)，超限中止上锁
timeout_traj: 12.0             # 轨迹总超时 (s)
odom_stale_timeout: 0.3        # VINS 位姿数据判 stale 阈值 (s)，超时中止
vins_jump_max_speed: 2.0       # VINS 位置(XY)单拍跳变钳制：位移/时间超此速度(m/s)判跳变、沿用上一拍；只作用位置反馈，不影响速度估计
ch6_mid_low: 1400              # CH6 中档判定下限
ch6_mid_high: 1600             # CH6 中档判定上限
ch6_debounce: 0.3              # CH6 中档去抖时长 (s)
override_threshold: 10         # 手动接管阈值：姿态/云台通道偏离中立(1500)超过该值即交还遥控
